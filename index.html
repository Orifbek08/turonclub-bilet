<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081229">
<title>Turon — Taklifnoma</title>
<script>
/* ═══════════════ SOZLAMA ═══════════════
   Apps Script → Развертывание dan chiqqan …/exec manzilini shu yerga qo'ying */
var API_URL = "https://script.google.com/macros/s/AKfycbx83dTzRFy3sKyxnCTihg1dQnkiSzm6iZrns5ddSqudbDAevi8hThTWGZ5MxUZXEPD7/exec";

<style>
  :root{
    --bg:#081229; --card:#0f1e42; --line:#22366b; --gold:#e9bd5b; --gold2:#b8862b;
    --txt:#eef2ff; --mut:#93a2c9; --red:#ff7676; --ok:#58d39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px}
  .brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.14em;color:var(--gold);font-size:20px}
  .brand small{display:block;font:500 11px/1.2 -apple-system,Arial,sans-serif;letter-spacing:.08em;color:var(--mut);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 12px;color:var(--gold);font-weight:600}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#091633;color:var(--txt);font-size:16px;outline:none}
  input:focus{border-color:var(--gold)}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .row3 label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  button{font:600 15px/1 inherit;border:0;border-radius:10px;padding:13px 16px;cursor:pointer;color:#1b1303;
         background:linear-gradient(180deg,var(--gold),var(--gold2))}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
  button.sm{padding:8px 12px;font-size:13px}
  .btns{display:flex;gap:8px;margin-top:14px}
  .btns button{flex:1}
  .msg{font-size:13px;min-height:18px;margin-top:10px;color:var(--red)}
  .msg.ok{color:var(--ok)}
  .hide{display:none!important}
  #preview img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
  .idbig{font-family:Georgia,serif;font-size:22px;color:var(--gold);font-weight:700}
  .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .item:first-child{border-top:0}
  .item .id{font:700 14px/1 Georgia,serif;color:var(--gold);min-width:46px}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .nm span{font-size:12px;color:var(--mut)}
  .item .pd{font-size:13px;color:var(--ok);white-space:nowrap;font-variant-numeric:tabular-nums}
  .head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .head h2{margin:0}
  .empty{color:var(--mut);font-size:14px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">TURON<small>Taklifnoma platformasi</small></div>
    <button id="btnOut" class="ghost sm hide">Chiqish</button>
  </header>

  <!-- LOGIN -->
  <form id="login" class="card">
    <h2>Kirish</h2>
    <label for="lg">Login</label>
    <input id="lg" autocomplete="username" autocapitalize="none" required>
    <label for="pw">Parol</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="btns"><button id="btnIn">Kirish</button></div>
    <div id="loginMsg" class="msg"></div>
  </form>

  <div id="app" class="hide">

    <!-- FORMA -->
    <form id="form" class="card">
      <h2 id="formTitle">Yangi mehmon</h2>
      <label for="fName">Ism familiya</label>
      <input id="fName" placeholder="Masalan: Aliyev Vali" autocomplete="off" required>
      <div class="row3">
        <div><label for="fDog">Dogovor</label><input id="fDog" inputmode="numeric" autocomplete="off"></div>
        <div><label for="fZak">Zaklad</label><input id="fZak" inputmode="numeric" autocomplete="off"></div>
        <div><label for="fPaid">To'lagan summa</label><input id="fPaid" inputmode="numeric" autocomplete="off"></div>
      </div>
      <div class="btns">
        <button id="btnSave">Saqlash va taklifnoma</button>
        <button type="button" id="btnNew" class="ghost hide" style="flex:0 0 auto">Yangi</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </form>

    <!-- TAKLIFNOMA -->
    <div id="preview" class="card hide">
      <div class="head">
        <h2>Taklifnoma</h2>
        <span class="idbig" id="pvId"></span>
      </div>
      <img id="pvImg" alt="Taklifnoma">
      <div class="btns">
        <button type="button" id="btnDl">Yuklab olish</button>
        <button type="button" id="btnShare" class="ghost">Ulashish</button>
      </div>
    </div>

    <!-- RO'YXAT -->
    <div class="card">
      <div class="head">
        <h2>Ro'yxat <span id="cnt" style="color:var(--mut);font-weight:400"></span></h2>
        <button type="button" id="btnRef" class="ghost sm">Yangilash</button>
      </div>
      <input id="q" placeholder="Qidirish: ism yoki ID" autocomplete="off">
      <div id="list" style="margin-top:8px"></div>
    </div>
  </div>
</div>

/* Yozuv joylari — rasm 853×1280 bo'yicha. Siljitish kerak bo'lsa shu yerdan. */
var POS = {
  name: { x: 490, y: 681, maxW: 480, size: 31 },   // "Ҳурматли ____" chizig'i ustida
  id:   { x: 426.5, y: 1247, size: 22 }            // eng pastda, o'rtada
};

var $ = function (id) { return document.getElementById(id); };
var auth = null, rows = [], editId = null, curBlob = null, curFile = "";
var tpl = new Image(); tpl.src = TPL_SRC;

/* ═══════════════ API ═══════════════ */
function api(action, data) {
  if (API_URL.indexOf("http") !== 0) return Promise.reject(new Error("API_URL qo'yilmagan (index.html boshida)"));
  var body = Object.assign({ action: action, login: auth.login, password: auth.password }, data || {});
  // text/plain — Apps Script uchun CORS muammosiz ishlaydi
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || "Xato"); return j; });
}

/* ═══════════════ LOGIN ═══════════════ */
function showApp(on) {
  $("login").classList.toggle("hide", on);
  $("app").classList.toggle("hide", !on);
  $("btnOut").classList.toggle("hide", !on);
}

$("login").addEventListener("submit", function (e) {
  e.preventDefault();
  auth = { login: $("lg").value.trim().toLowerCase(), password: $("pw").value };
  $("btnIn").disabled = true; msg("loginMsg", "Tekshirilmoqda…", true);
  api("list").then(function (j) {
    try { localStorage.setItem("turon_auth", JSON.stringify(auth)); } catch (e) {}
    msg("loginMsg", ""); $("pw").value = "";
    setRows(j.rows); showApp(true);
  }).catch(function (err) { auth = null; msg("loginMsg", err.message); })
    .then(function () { $("btnIn").disabled = false; });
});

$("btnOut").addEventListener("click", function () {
  try { localStorage.removeItem("turon_auth"); } catch (e) {}
  auth = null; rows = []; resetForm(); showApp(false);
});

/* ═══════════════ FORMA ═══════════════ */
function msg(id, text, ok) { var el = $(id); el.textContent = text || ""; el.classList.toggle("ok", !!ok); }

function resetForm() {
  editId = null;
  $("form").reset();
  $("formTitle").textContent = "Yangi mehmon";
  $("btnSave").textContent = "Saqlash va taklifnoma";
  $("btnNew").classList.add("hide");
  $("preview").classList.add("hide");
  msg("formMsg", "");
}

$("btnNew").addEventListener("click", function () { resetForm(); $("fName").focus(); });

$("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var data = { name: $("fName").value.replace(/\s+/g, " ").trim(),
               dog: $("fDog").value, zak: $("fZak").value, paid: $("fPaid").value };
  if (!data.name) return;
  if (editId) data.id = editId;
  $("btnSave").disabled = true; msg("formMsg", "Saqlanmoqda…", true);
  api(editId ? "update" : "add", data).then(function (j) {
    var r = j.row, i = rows.findIndex(function (x) { return x.id === r.id; });
    if (i >= 0) rows[i] = r; else rows.unshift(r);
    renderList();
    openRow(r);
    msg("formMsg", "Saqlandi — ID " + r.id, true);
  }).catch(function (err) { msg("formMsg", err.message); })
    .then(function () { $("btnSave").disabled = false; });
});

function openRow(r) {
  editId = r.id;
  $("fName").value = r.name;
  $("fDog").value = r.dog === "" || r.dog == null ? "" : r.dog;
  $("fZak").value = r.zak === "" || r.zak == null ? "" : r.zak;
  $("fPaid").value = r.paid === "" || r.paid == null ? "" : r.paid;
  $("formTitle").textContent = "ID " + r.id + " — tahrirlash";
  $("btnSave").textContent = "Saqlash";
  $("btnNew").classList.remove("hide");
  msg("formMsg", "");
  makeTicket(r);
}

/* ═══════════════ TAKLIFNOMA CHIZISH ═══════════════ */
function makeTicket(r) {
  var draw = function () {
    var c = document.createElement("canvas");
    c.width = tpl.naturalWidth; c.height = tpl.naturalHeight;
    var k = c.width / 853, g = c.getContext("2d");
    g.drawImage(tpl, 0, 0);

    // — ism familiya —
    var n = POS.name, size = n.size * k;
    g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillStyle = "#14110d";
    do { g.font = "italic 700 " + size + "px Georgia, 'Times New Roman', serif"; size -= 1; }
    while (g.measureText(r.name).width > n.maxW * k && size > 12 * k);
    g.fillText(r.name, n.x * k, n.y * k);

    // — ID (pastda) —
    var d = POS.id, text = "ID  " + r.id;
    g.font = "700 " + (d.size * k) + "px Georgia, 'Times New Roman', serif";
    var w = g.measureText(text).width + 44 * k, h = 38 * k, x = d.x * k - w / 2, y = d.y * k - h / 2;
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, h / 2); else g.rect(x, y, w, h);
    g.fillStyle = "rgba(6,13,34,.88)"; g.fill();
    g.lineWidth = 1.5 * k; g.strokeStyle = "#e9bd5b"; g.stroke();
    g.fillStyle = "#f3cf7a"; g.textBaseline = "middle";
    g.fillText(text, d.x * k, d.y * k + 1 * k);

    c.toBlob(function (b) {
      curBlob = b;
      curFile = "taklifnoma-" + r.id + "-" + r.name.replace(/[^\p{L}\p{N}]+/gu, "_") + ".jpg";
      if ($("pvImg").src.indexOf("blob:") === 0) URL.revokeObjectURL($("pvImg").src);
      $("pvImg").src = URL.createObjectURL(b);
      $("pvId").textContent = "ID " + r.id;
      $("preview").classList.remove("hide");
      $("btnShare").classList.toggle("hide", !(navigator.canShare && window.File));
    }, "image/jpeg", 0.93);
  };
  if (tpl.complete && tpl.naturalWidth) draw(); else tpl.onload = draw;
}

$("btnDl").addEventListener("click", function () {
  if (!curBlob) return;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(curBlob); a.download = curFile;
  document.body.appendChild(a); a.click(); a.remove();
});

$("btnShare").addEventListener("click", function () {
  if (!curBlob) return;
  var f = new File([curBlob], curFile, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f] }).catch(function () {});
  else $("btnDl").click();
});

/* ═══════════════ RO'YXAT ═══════════════ */
function setRows(r) { rows = r || []; renderList(); }

function fmt(v) {
  if (v === "" || v == null) return "";
  return typeof v === "number" ? v.toLocaleString("ru-RU") : String(v);
}

function renderList() {
  var q = $("q").value.trim().toLowerCase(), box = $("list");
  var f = rows.filter(function (r) { return !q || r.name.toLowerCase().indexOf(q) >= 0 || r.id.indexOf(q) >= 0; });
  $("cnt").textContent = "(" + rows.length + ")";
  box.textContent = "";
  if (!f.length) { var e = document.createElement("div"); e.className = "empty"; e.textContent = rows.length ? "Topilmadi" : "Hali hech kim yo'q"; box.appendChild(e); return; }
  f.slice(0, 300).forEach(function (r) {
    var it = document.createElement("div"); it.className = "item";
    var id = document.createElement("div"); id.className = "id"; id.textContent = r.id;
    var nm = document.createElement("div"); nm.className = "nm";
    var b = document.createElement("b"); b.textContent = r.name;
    var s = document.createElement("span"); s.textContent = r.by || "";
    nm.appendChild(b); nm.appendChild(s);
    var pd = document.createElement("div"); pd.className = "pd"; pd.textContent = fmt(r.paid);
    it.appendChild(id); it.appendChild(nm); it.appendChild(pd);
    it.addEventListener("click", function () { openRow(r); window.scrollTo({ top: 0, behavior: "smooth" }); });
    box.appendChild(it);
  });
}

$("q").addEventListener("input", renderList);

function refresh() {
  $("btnRef").disabled = true;
  return api("list").then(function (j) { setRows(j.rows); })
    .catch(function (err) { msg("formMsg", err.message); })
    .then(function () { $("btnRef").disabled = false; });
}
$("btnRef").addEventListener("click", refresh);

/* ═══════════════ START ═══════════════ */
try { auth = JSON.parse(localStorage.getItem("turon_auth") || "null"); } catch (e) { auth = null; }
if (auth) { showApp(true); refresh(); }
</script>
