<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Турон Форум</title>
<script>
/* ═══════════════ SOZLAMA ═══════════════
   Apps Script → Развертывание dan chiqqan …/exec manzilini shu yerga qo'ying */
var API_URL = "https://script.google.com/macros/s/AKfycbx83dTzRFy3sKyxnCTihg1dQnkiSzm6iZrns5ddSqudbDAevi8hThTWGZ5MxUZXEPD7/exec";
</script>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --ink:#0f172a; --mut:#94a3b8; --line:#eef0f5;
  --pri:#4f46e5; --pri2:#7c3aed; --ok:#10b981; --no:#ef4444; --on:#3b82f6;
  --am:#f59e0b; --sh:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.anim{animation:fadeUp .32s cubic-bezier(.22,.9,.3,1) both}

/* ── LOGIN ── */
#lWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(150deg,#312e81,#4f46e5 45%,#7c3aed)}
.lbox{background:#fff;border-radius:24px;padding:34px 26px;width:100%;max-width:380px;
  box-shadow:0 24px 70px rgba(0,0,0,.3);animation:pop .35s both}
.llogo{width:66px;height:66px;margin:0 auto 14px;border-radius:20px;display:flex;align-items:center;
  justify-content:center;font-size:32px;background:linear-gradient(135deg,var(--pri),var(--pri2));
  box-shadow:0 10px 24px rgba(79,70,229,.35)}
.ltitle{font-size:25px;font-weight:800;text-align:center;letter-spacing:-.5px}
.lsub{font-size:13px;color:var(--mut);text-align:center;margin:4px 0 24px}

/* ── FORM ── */
.fl{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.6px}
.fi,.fs{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
  font-size:15px;outline:none;color:var(--ink);background:#fbfcfe;margin-bottom:14px;
  transition:border-color .18s,background .18s,box-shadow .18s;font-family:inherit}
.fi:focus,.fs:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.1)}
.fs{-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2394a3b8' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .12s,opacity .15s,box-shadow .18s;font-family:inherit}
.btn:active{transform:scale(.98);opacity:.9}
.btn+.btn{margin-top:9px}
.bp{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.32)}
.bg{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.3)}
.br{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 6px 18px rgba(239,68,68,.28)}
.bgr{background:#f1f5f9;color:#64748b}
.bsm{width:auto;padding:9px 15px;font-size:13px;border-radius:10px}

/* ── HEADER ── */
.hdr{background:linear-gradient(120deg,#312e81,var(--pri) 60%,var(--pri2));padding:14px 16px;
  display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:60;
  box-shadow:0 4px 20px rgba(49,46,129,.28);padding-top:calc(14px + env(safe-area-inset-top))}
.ht{flex:1;font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px}
.hu{font-size:11px;color:#fff;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:20px;
  white-space:nowrap;font-weight:600;backdrop-filter:blur(8px)}
.hb{background:rgba(255,255,255,.16);border:none;color:#fff;padding:7px 13px;border-radius:10px;
  font-size:12px;cursor:pointer;font-weight:600;font-family:inherit}
.hb:active{background:rgba(255,255,255,.3)}

/* ── NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;z-index:60;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 20px rgba(15,23,42,.06)}
.bni{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;border:none;background:none;transition:transform .14s;font-family:inherit}
.bni:active{transform:scale(.92)}
.bni-i{font-size:21px;line-height:1;filter:grayscale(1);opacity:.5;transition:.2s}
.bni-l{font-size:10px;color:var(--mut);font-weight:600}
.bni.on .bni-i{filter:none;opacity:1;transform:translateY(-1px)}
.bni.on .bni-l{color:var(--pri);font-weight:800}

.page{display:none;padding-bottom:88px;animation:fadeUp .28s both}
.page.on{display:block}

/* ── STAT CARDS ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:14px}
.sc{background:var(--card);border-radius:var(--r);padding:16px 13px;box-shadow:var(--sh);
  position:relative;overflow:hidden;transition:transform .16s}
.sc:active{transform:scale(.98)}
.sc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pri)}
.sc.g::before{background:var(--ok)}.sc.r::before{background:var(--no)}
.sc.a::before{background:var(--am)}.sc.p::before{background:var(--pri2)}
.scn{font-size:23px;font-weight:800;letter-spacing:-.8px;margin-bottom:3px}
.scl{font-size:11px;color:var(--mut);font-weight:600}
.wide{grid-column:span 2}
.cbl{color:var(--pri)}.cgr{color:var(--ok)}.crd{color:var(--no)}
.cam{color:var(--am)}.cpr{color:var(--pri2)}

/* ── CARD ── */
.card{background:var(--card);border-radius:var(--r);padding:17px;margin:0 14px 12px;box-shadow:var(--sh)}
.ct{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:13px;display:flex;align-items:center;gap:7px}

/* ── PROGRESS ── */
.pbar{height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:9px;width:100%}
.pfill{height:100%;background:linear-gradient(90deg,var(--ok),#34d399);border-radius:6px;
  transition:width .5s cubic-bezier(.22,.9,.3,1)}

/* ── KURATOR/TARIF ROW ── */
.krow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;
  border-bottom:1px solid var(--line);gap:10px}
.krow:last-child{border:0;padding-bottom:0}
.krn{font-size:14px;font-weight:700}
.kri{font-size:11.5px;color:var(--mut);margin-top:3px}
.kcnt{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:5px 12px;
  border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}

/* ── SEARCH BAR ── */
.fbar{padding:14px 14px 6px;display:flex;gap:8px;flex-wrap:wrap}
.fbar .fi{flex:1 1 100%;margin:0}
.fbar .fs{flex:1;margin:0;min-width:0;font-size:13px;padding:11px 32px 11px 13px}

/* ── LIST ITEM ── */
.si{background:var(--card);border-radius:14px;padding:13px 15px;margin:0 14px 9px;display:flex;
  align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer;transition:transform .14s}
.si:active{transform:scale(.985)}
.sav{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;
  flex-shrink:0;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.sinf{flex:1;min-width:0}
.sn{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:11.5px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{font-size:15px;font-weight:800;flex-shrink:0}
.qred{color:var(--no)}.qgrn{color:var(--ok)}
/* ── PROFILE ── */
.phdr{background:linear-gradient(140deg,#312e81,var(--pri) 55%,var(--pri2));padding:26px 18px 22px;
  text-align:center;color:#fff}
.pav{width:76px;height:76px;background:rgba(255,255,255,.22);border-radius:24px;display:flex;
  align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 12px;
  backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,.28)}
.pnm{font-size:20px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px}
.pidd{font-size:12.5px;opacity:.86}
.ptags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:9px}
.ptag{font-size:11.5px;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;
  font-weight:600;backdrop-filter:blur(8px)}
.psts{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-bottom:1px solid var(--line)}
.pst{padding:13px 5px;text-align:center;border-right:1px solid var(--line)}
.pst:last-child{border:0}
.pstn{font-size:15px;font-weight:800}
.pstl{font-size:10px;color:var(--mut);margin-top:3px;font-weight:600}
/* ── SCAN ── */
.swrap{padding:14px}
.sbox{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.slbl{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;
  margin-bottom:10px;letter-spacing:.7px}
.srow{display:flex;gap:9px}
.srow .fi{flex:1;margin:0}
/* ── MSG ── */
.mok{background:#d1fae5;color:#065f46;padding:13px;border-radius:12px;font-size:13px;
  text-align:center;margin-top:12px;font-weight:600;animation:pop .25s both}
.mer{background:#fee2e2;color:#991b1b;padding:13px;border-radius:12px;font-size:13px;
  text-align:center;margin-top:12px;font-weight:600;animation:pop .25s both}
.minf{background:#e0e7ff;color:#3730a3;padding:13px;border-radius:12px;font-size:13px;
  text-align:center;margin-top:12px;font-weight:600}

/* ── LOADING ── */
.ldg{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px;gap:12px}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--pri);
  border-radius:50%;animation:sp .7s linear infinite}
.ldgt{font-size:12.5px;color:var(--mut);font-weight:600}
.skel{height:66px;border-radius:14px;margin:0 14px 9px;
  background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);
  background-size:800px 100%;animation:shimmer 1.3s infinite linear}

.izohbox{background:#faf5ff;border:1px solid #e9d5ff;border-radius:12px;padding:12px 14px;
  margin-top:12px;font-size:12.5px;color:#581c87;white-space:pre-wrap;line-height:1.65}
.izohbox b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:#7c3aed;margin-bottom:6px}
.chip{display:inline-block;background:#fef3c7;color:#92400e;padding:3px 9px;border-radius:8px;
  font-size:11px;font-weight:700;margin-left:6px}
.empty{padding:52px 22px;text-align:center;color:var(--mut)}
.empty-i{font-size:44px;opacity:.35;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:600}

/* ── TURON qo'shimchalari ── */
.wrapc{max-width:760px;margin:0 auto}
.page{padding-bottom:110px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hb-ic{padding:7px 11px;font-size:16px;line-height:1;font-weight:400}
.hb-ic.spinning{animation:sp .8s linear infinite}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.brow{display:flex;gap:9px;margin-top:9px}
.brow .btn{margin:0}
.bdg{padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bkk{background:#d1fae5;color:#065f46}.bmm{background:#fee2e2;color:#991b1b}
.bmt{background:#f1f5f9;color:#64748b}.bto{background:#fef3c7;color:#92400e}.bol{background:#dbeafe;color:#1e40af}
.sav.t{background:linear-gradient(135deg,#f59e0b,#b45309);box-shadow:0 4px 12px rgba(180,83,9,.28)}
.sav{font-size:13px}
.sright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.gcard{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.gcard.t .phdr{background:linear-gradient(140deg,#78350f,#b45309 55%,#f59e0b)}
.gbody{padding:14px 16px 16px}
.qarzbox{background:#fee2e2;color:#991b1b;padding:14px;border-radius:12px;font-size:19px;font-weight:800;text-align:center;letter-spacing:-.3px}
.okbox{background:#d1fae5;color:#065f46;padding:13px;border-radius:12px;font-size:14px;font-weight:700;text-align:center}
.okbox small,.qarzbox small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:3px;letter-spacing:0}
.payrow{display:flex;gap:9px;margin-top:10px}
.payrow .fi{flex:1;margin:0}
.payrow .btn{margin:0}
.idin{font-size:22px!important;font-weight:800;text-align:center;letter-spacing:.5px}
.pv img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top));z-index:90;background:#fff;
  border-left:5px solid var(--ok);padding:12px 14px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:0 10px 30px rgba(15,23,42,.18);animation:fadeUp .2s both;max-width:560px;margin:0 auto}
.toast.er{border-left-color:var(--no)}
.qov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.qsheet{background:var(--bg);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(15,23,42,.2);animation:fadeUp .22s both}
@media(min-width:700px){.qov{align-items:center}.qsheet{border-radius:18px}}
.net{font-size:11px;font-weight:700;color:#fff;background:#b45309;text-align:center;padding:5px}
@media(min-width:700px){.sg{grid-template-columns:repeat(4,1fr)}.wide{grid-column:span 4}}

</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<form id="lWrap">
  <div class="lbox">
    <div class="llogo">🎫</div>
    <div class="ltitle">Турон Форум</div>
    <div class="lsub">Билет · Таклифнома · Давомат</div>
    <label class="fl" for="lU">Фойдаланувчи</label>
    <input type="text" id="lU" class="fi" placeholder="admin" autocomplete="username" autocapitalize="off" required>
    <label class="fl" for="lP">Парол</label>
    <input type="password" id="lP" class="fi" placeholder="••••••••" autocomplete="current-password" required>
    <button class="btn bp" id="loginBtn">Кириш</button>
    <div id="lMsg"></div>
  </div>
</form>

<!-- ══ APP ══ -->
<div id="aWrap" class="hide">
  <div class="hdr">
    <div class="ht" id="hT">Бошқарув</div>
    <div class="hu" id="hU"></div>
    <button class="hb hb-ic" id="refreshBtn" title="Янгилаш">⟳</button>
    <button class="hb" id="logoutBtn">Чиқиш</button>
  </div>
  <div id="net" class="net hide"></div>

  <div class="wrapc">

  <!-- ── BOSHQARUV ── -->
  <div id="p0" class="page">
    <div class="sg">
      <div class="sc"><div class="scn cbl" id="dB">0</div><div class="scl">Билетлар</div></div>
      <div class="sc a"><div class="scn cam" id="dT">0</div><div class="scl">Таклифномалар</div></div>
      <div class="sc g"><div class="scn cgr" id="dK">0</div><div class="scl">Келди</div></div>
      <div class="sc r"><div class="scn crd" id="dQn">0</div><div class="scl">Қарздорлар</div></div>
      <div class="sc a"><div class="scn cam" id="dDog">0</div><div class="scl">Жами договор</div></div>
      <div class="sc g"><div class="scn cgr" id="dPaid">0</div><div class="scl">Тўланган</div></div>
      <div class="sc r wide">
        <div class="scn crd" id="dQ">0</div>
        <div class="scl">Умумий қолган қарз</div>
        <div class="pbar"><div class="pfill" id="dPay" style="width:0%"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="ct">✅ Давомат</div>
      <div id="attD"></div>
    </div>
    <div class="card"><div class="ct">👥 Ким нечта киритган</div><div id="byD"></div></div>
  </div>

  <!-- ── DAVOMAT ── -->
  <div id="p1" class="page">
    <div class="swrap">
      <form class="sbox" id="sForm">
        <div class="slbl">🔍 ID ёки исм бўйича</div>
        <div class="srow">
          <input type="text" id="sId" class="fi idin" placeholder="ID" autocomplete="off" inputmode="search" aria-label="ID ёки исм">
          <button class="btn bp bsm" style="margin:0">Текшириш</button>
        </div>
        <div id="sMsg"></div>
      </form>
      <div id="sPick"></div>
      <div id="stCard" class="hide"></div>
      <div class="card" style="margin:0">
        <div class="ct">🕘 Охирги келганлар <span id="lastCnt" style="margin-left:auto;color:var(--ok)"></span></div>
        <div id="lastD"></div>
      </div>
    </div>
  </div>

  <!-- ── RO'YXAT ── -->
  <div id="p2" class="page">
    <div class="fbar">
      <input type="text" id="fQ" class="fi" placeholder="Қидириш: исм ёки ID…" autocomplete="off" aria-label="Қидириш">
      <select id="fT" class="fs" aria-label="Тури">
        <option value="">Ҳаммаси</option><option value="b">🎫 Билет</option><option value="t">💌 Таклифнома</option>
      </select>
      <select id="fH" class="fs" aria-label="Ҳолат">
        <option value="">Барча ҳолат</option><option value="came">✅ Келди</option>
        <option value="wait">⏳ Келмаган</option><option value="debt">💰 Қарздор</option>
      </select>
    </div>
    <div id="listCnt" style="padding:4px 18px 8px;font-size:11.5px;color:var(--mut);font-weight:700"></div>
    <div id="listD"></div>
  </div>

  <!-- ── BILET YARATISH ── -->
  <div id="p3" class="page">
    <div style="height:14px"></div>
    <form class="card" id="form_b">
      <div class="ct" id="ft_b">🎫 Янги билет</div>
      <label class="fl" for="fn_b">Исм фамилия</label>
      <input type="text" id="fn_b" class="fi" placeholder="Масалан: Алиев Вали" autocomplete="off" required>
      <div class="g2">
        <div><label class="fl" for="fd_b">Договор сумма</label><input type="text" id="fd_b" class="fi mny" placeholder="0" inputmode="numeric" autocomplete="off"></div>
        <div><label class="fl" for="fz_b">Заклад</label><input type="text" id="fz_b" class="fi mny" placeholder="0" inputmode="numeric" autocomplete="off"></div>
      </div>
      <label class="fl" for="fp_b">Келиб тўлаган сумма</label>
      <input type="text" id="fp_b" class="fi mny" placeholder="0" inputmode="numeric" autocomplete="off">
      <button class="btn bp" id="fs_b">Сақлаш ва билет чиқариш</button>
      <button type="button" class="btn bgr hide" id="fx_b">➕ Янги билет</button>
    </form>
    <div class="card pv b hide" id="pv_b">
      <div class="ct">🖼 Билет <span id="pi_b" style="margin-left:auto;color:var(--pri)"></span></div>
      <img id="pm_b" alt="Билет">
      <div class="brow">

      <button type="button" class="btn bgr hide" id="fx_t">➕ Янги таклифнома</button>
    </form>
    <div class="card pv t hide" id="pv_t">
      <div class="ct">🖼 Таклифнома <span id="pi_t" style="margin-left:auto;color:var(--pri)"></span></div>
      <img id="pm_t" alt="Таклифнома">
      <div class="brow">
        <button type="button" class="btn bg" id="pd_t">⬇️ Юклаб олиш</button>

  </div>

  <div class="bnav" id="bnav">
    <button class="bni" data-p="0"><span class="bni-i">📊</span><span class="bni-l">Бошқарув</span></button>
    <button class="bni" data-p="1"><span class="bni-i">✅</span><span class="bni-l">Давомат</span></button>
    <button class="bni" data-p="2"><span class="bni-i">👥</span><span class="bni-l">Рўйхат</span></button>
    <button class="bni" data-p="3"><span class="bni-i">🎫</span><span class="bni-l">Билет</span></button>

</div>

<div id="ov" class="qov hide"><div class="qsheet" id="ovBody"></div></div>
<div id="toast" class="toast hide" role="status"></div>

<script>
/* ═══════════════ SHABLONLAR ═══════════════
   Rasm fayllari index.html yonida turadi (bilet.jpg, taklifnoma.jpg).
   Yozuv joyini siljitish kerak bo'lsa — shu yerdagi x / y ni o'zgartiring. */
var TPL = {
  b: { src: "chipta.jpg", w: 2000, label: "Билет",      file: "bilet" },
  t: { src: "chipta.jpg", w: 2000, label: "Таклифнома", file: "taklifnoma" }
};
/* Ёзув жойлари (расм 2000×943). Ўнг томондаги тик қутилар: матн пастдан тепага ёзилади.
   x — қути ўртаси, y — матн бошланадиган жой (пастки учи), len — тепага қараб бўш жой узунлиги. */
var POS = {
  name: { x: 1748, y: 616, len: 400, size: 40, boxW: 64 },   // «ФИО:» дан кейин
  id:   { x: 1845, y: 676, len: 460, size: 46 }              // «ID:» дан кейин
};
Object.keys(TPL).forEach(function (k) { var i = new Image(); i.src = TPL[k].src; TPL[k].img = i; });

var $ = function (id) { return document.getElementById(id); };
var auth = null, me = { name: "", role: "" }, rows = [], ver = "";
var page = 1, curKey = null, ovKey = null, edit = { b: null, t: null }, blob = { b: null, t: null }, fname = { b: "", t: "" };
var pending = 0, pollN = 0, netFails = 0;
var TITLES = ["Бошқарув", "Давомат", "Рўйхат", "Билет яратиш", "Таклифнома яратиш"];

/* ═══════════════ YORDAMCHILAR ═══════════════ */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function n0(v) { return typeof v === "number" ? v : (parseFloat(String(v == null ? "" : v).replace(/[\s,']/g, "")) || 0); }
function fmt(v) {
  if (v === "" || v == null) return "0";
  return typeof v === "number" ? v.toLocaleString("ru-RU").replace(/ /g, " ") : String(v);
}
function key(r) { return r.t + r.id; }
function byKey(k) { for (var i = 0; i < rows.length; i++) if (key(rows[i]) === k) return rows[i]; return null; }
function merge(r) {
  if (!r) return;
  for (var i = 0; i < rows.length; i++) if (key(rows[i]) === key(r)) { rows[i] = r; return; }
  rows.push(r);
}
function isDebt(r) { return r.t === "b" && r.qarz > 0; }
function initials(name) {
  var p = String(name).trim().split(/\s+/);
  return ((p[0] || "").charAt(0) + (p[1] || "").charAt(0)).toUpperCase() || "?";
}
function hhmm() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

var toastT = null;
function toast(text, bad) {
  var t = $("toast"); t.textContent = text; t.className = "toast" + (bad ? " er" : "");
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.add("hide"); }, bad ? 5000 : 2200);
}
function box(id, cls, text) { var b = $(id); b.textContent = ""; if (text) b.appendChild(el("div", cls, text)); }

function saveCache() {
  try { localStorage.setItem("turon_data", JSON.stringify({ rows: rows, me: me })); } catch (e) {}
}

/* ═══════════════ API ═══════════════ */
var WRITES = { add: 1, update: 1, pay: 1, attend: 1 };
/* Интернет секин ёки узилиб қолса: 20 сония кутади, жавоб келмаса ўзи 2 марта қайта уринади.
   Ёзувларда rid юборилади — сервер бир хил rid ни ИККИНЧИ марта бажармайди (дубликат бўлмайди). */
function api(action, data) {
  var body = Object.assign({ action: action, login: auth.login, password: auth.password }, data || {});
  if (WRITES[action]) body.rid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  var payload = JSON.stringify(body), tries = WRITES[action] ? 3 : 2;

  function once() {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    // text/plain — Apps Script uchun CORS muammosiz ishlaydi
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: payload, signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.text(); })
      .then(function (t) { clearTimeout(timer); return JSON.parse(t); },
            function (e) { clearTimeout(timer); throw e; });
  }
  function attempt(n) {
    return once().catch(function () {
      if (n + 1 < tries) return new Promise(function (ok) { setTimeout(ok, 800); }).then(function () { return attempt(n + 1); });
      var er = new Error("Интернет секин ёки узилди — жавоб келмади. Қайта уриниб кўринг.");
      er.net = true; throw er;
    });
  }
  return attempt(0).then(function (j) {
    if (!j.ok) { var er = new Error(j.error || "Хато"); er.auth = j.auth; er.row = j.row; throw er; }
    return j;
  });
}
function authFail(err) {
  if (err && err.auth === false) { logout(); box("lMsg", "mer", err.message); return true; }
  return false;
}

/* Yozuvlar ketma-ket yuboriladi (tartib buzilmasin). Ekran esa DARHOL yangilanadi. */
var chain = Promise.resolve();
function write(action, r, data, apply) {
  var k = key(r), prev = JSON.parse(JSON.stringify(r));
  apply(r); pending++; renderAll();
  chain = chain.then(function () {
    return api(action, Object.assign({ t: r.t, id: r.id }, data)).then(function (j) {
      pending--; if (pending === 0) { merge(j.row); renderAll(); }
      saveCache();
    }, function (err) {
      pending--;
      if (authFail(err)) return;
      merge(err.row || prev); renderAll();
      toast(err.message, true);
    });
  });
}

/* ═══════════════ LOGIN ═══════════════ */
function showApp(on) {
  $("lWrap").classList.toggle("hide", on);
  $("aWrap").classList.toggle("hide", !on);
}
function setMe(m) { if (m) me = m; $("hU").textContent = me.name || ""; }
function logout() {
  try { localStorage.removeItem("turon_auth"); localStorage.removeItem("turon_data"); } catch (e) {}
  auth = null; rows = []; ver = ""; curKey = null; closeOv(); resetForm("b"); resetForm("t");
  $("stCard").classList.add("hide"); showApp(false);
}

$("lWrap").addEventListener("submit", function (e) {
  e.preventDefault();
  auth = { login: $("lU").value.trim().toLowerCase(), password: $("lP").value };
  $("loginBtn").disabled = true; box("lMsg", "minf", "Текширилмоқда…");
  api("list").then(function (j) {
    try { localStorage.setItem("turon_auth", JSON.stringify(auth)); } catch (e) {}
    box("lMsg"); $("lP").value = "";
    setMe(j.me); rows = j.rows || []; ver = j.ver || ""; saveCache();
    showApp(true); go(1);
  }).catch(function (err) { auth = null; box("lMsg", "mer", err.message); })
    .then(function () { $("loginBtn").disabled = false; });
});
$("logoutBtn").addEventListener("click", logout);

/* ═══════════════ NAVIGATSIYA ═══════════════ */
function go(p) {
  page = p;
  for (var i = 0; i < 5; i++) $("p" + i).classList.toggle("on", i === p);
  Array.prototype.forEach.call($("bnav").children, function (b) { b.classList.toggle("on", +b.dataset.p === p); });
  $("hT").textContent = TITLES[p];
  renderAll();
  if (p === 1) $("sId").focus();
  window.scrollTo(0, 0);
}
$("bnav").addEventListener("click", function (e) {
  var b = e.target.closest(".bni"); if (!b) return;
  var p = +b.dataset.p;
  // menyudan kirilganda har doim YANGI forma (eski tahrir ustiga yozib yubormaslik uchun)
  if (p === 3) resetForm("b");
  if (p === 4) resetForm("t");
  go(p);
  if (p === 3) $("fn_b").focus();
  if (p === 4) $("fn_t").focus();
});

function renderAll() {
  if (page === 0) renderPanel();
  if (page === 1) { renderLast(); redrawCard("stCard", curKey, "dav"); }
  if (page === 2) renderList();
  if (ovKey) redrawCard("ovBody", ovKey, "ov");
}
function redrawCard(boxId, k, where) {
  if (!k) return;
  var a = document.activeElement;
  if (a && a.tagName === "INPUT" && $(boxId).contains(a)) return;   // yozayotgan bo'lsa tegmaymiz
  var r = byKey(k); if (r) drawGuest($(boxId), r, where);
}

/** Serverdan yangilash. full=false bo'lsa — o'zgarish bo'lmasa server jadvalni o'qimaydi (tez). */
function refresh(full, loud) {
  if (!auth) return Promise.resolve();
  return api("list", full ? {} : { ver: ver }).then(function (j) {
    netFails = 0; $("net").classList.add("hide");
    setMe(j.me);
    if (j.same || pending > 0) return;       // o'zgarish yo'q / yozuv ketayotgan payt
    rows = j.rows || []; ver = j.ver || ""; saveCache(); renderAll();
  }).catch(function (err) {
    if (authFail(err)) return;
    netFails++;
    if (loud) toast(err.message, true);
    else if (netFails >= 2) { $("net").textContent = err.net ? "Интернет секин ёки узилди — қайта уринилмоқда…" : err.message; $("net").classList.remove("hide"); }
  });
}
$("refreshBtn").addEventListener("click", function () {
  var b = $("refreshBtn"); b.classList.add("spinning");
  refresh(true, true).then(function () { b.classList.remove("spinning"); });
});
// 10 kishi bir vaqtda ishlaydi — har 12 soniyada boshqalarning o'zgarishlari olinadi
setInterval(function () {
  if (!auth || document.hidden) return;
  pollN++; refresh(pollN % 5 === 0, false);
}, 12000);
document.addEventListener("visibilitychange", function () { if (auth && !document.hidden) refresh(false, false); });

/* ═══════════════ BOSHQARUV ═══════════════ */
function renderPanel() {
  var nb = 0, nt = 0, cb = 0, ct = 0, debt = 0, dog = 0, paid = 0, qarz = 0, by = {};
  rows.forEach(function (r) {
    var came = r.att === "Келди";
    if (r.t === "b") {
      nb++; if (came) cb++;
      dog += n0(r.dog); paid += n0(r.zak) + n0(r.paid);
      if (r.qarz > 0) { debt++; qarz += r.qarz; }
    } else { nt++; if (came) ct++; }
    var k = r.by || "—"; by[k] = by[k] || { b: 0, t: 0 }; by[k][r.t]++;
  });
  $("dB").textContent = nb; $("dT").textContent = nt;
  $("dK").textContent = (cb + ct) + " / " + (nb + nt);
  $("dQn").textContent = debt;
  $("dDog").textContent = fmt(dog); $("dPaid").textContent = fmt(paid); $("dQ").textContent = fmt(qarz);
  $("dPay").style.width = (dog > 0 ? Math.min(100, Math.round(paid * 100 / dog)) : 0) + "%";

  var a = $("attD"); a.textContent = "";
  [["🎫 Билет", cb, nb], ["💌 Таклифнома", ct, nt]].forEach(function (x) {
    var row = el("div", "krow"), l = el("div"); l.style.flex = "1";
    l.appendChild(el("div", "krn", x[0]));
    l.appendChild(el("div", "kri", "Келди " + x[1] + " · келмаган " + (x[2] - x[1])));
    var pb = el("div", "pbar"), pf = el("div", "pfill"); pf.style.width = (x[2] ? Math.round(x[1] * 100 / x[2]) : 0) + "%";
    pb.appendChild(pf); l.appendChild(pb);
    row.appendChild(l); row.appendChild(el("div", "kcnt", x[1] + " / " + x[2]));
    a.appendChild(row);
  });

  var d = $("byD"); d.textContent = "";
  var keys = Object.keys(by).sort(function (x, y) { return (by[y].b + by[y].t) - (by[x].b + by[x].t); });
  if (!keys.length) d.appendChild(el("div", "kri", "Ҳали ҳеч ким киритилмаган"));
  keys.forEach(function (k) {
    var row = el("div", "krow"), l = el("div");
    l.appendChild(el("div", "krn", k));
    l.appendChild(el("div", "kri", "Билет " + by[k].b + " · Таклифнома " + by[k].t));
    row.appendChild(l); row.appendChild(el("div", "kcnt", by[k].b + by[k].t));
    d.appendChild(row);
  });
}

/* ═══════════════ RO'YXAT ELEMENTI ═══════════════ */
function badge(r) {
  if (r.att === "Келди") return el("span", "bdg bkk", "✓ Келди " + (r.attAt || ""));
  if (r.att === "Келмади") return el("span", "bdg bmm", "Келмади");
  return el("span", "bdg bmt", "Кутилмоқда");
}
function item(r, onClick) {
  var it = el("div", "si");
  it.appendChild(el("div", "sav" + (r.t === "t" ? " t" : ""), r.id));
  var inf = el("div", "sinf");
  inf.appendChild(el("div", "sn", r.name));
  inf.appendChild(el("div", "ss", TPL[r.t].label + (r.by ? " · " + r.by : "")));
  it.appendChild(inf);
  var rt = el("div", "sright");
  rt.appendChild(badge(r));
  if (isDebt(r)) rt.appendChild(el("span", "sq qred", "−" + fmt(r.qarz)));
  it.appendChild(rt);
  it.addEventListener("click", function () { onClick(r); });
  return it;
}
function emptyBox(icon, text) {
  var e = el("div", "empty"); e.appendChild(el("div", "empty-i", icon)); e.appendChild(el("div", "empty-t", text)); return e;
}

function renderList() {
  var q = $("fQ").value.trim().toLowerCase(), ft = $("fT").value, fh = $("fH").value, d = $("listD");
  var f = rows.filter(function (r) {
    if (ft && r.t !== ft) return false;
    if (fh === "came" && r.att !== "Келди") return false;
    if (fh === "wait" && r.att === "Келди") return false;
    if (fh === "debt" && !isDebt(r)) return false;
    return !q || r.name.toLowerCase().indexOf(q) >= 0 || r.id === q;
  }).sort(function (a, b) { return a.t === b.t ? n0(b.id) - n0(a.id) : (a.t < b.t ? -1 : 1); });
  $("listCnt").textContent = f.length + " та" + (f.length !== rows.length ? " (жами " + rows.length + ")" : "");
  d.textContent = "";
  if (!f.length) { d.appendChild(emptyBox("👥", rows.length ? "Топилмади" : "Ҳали ҳеч ким йўқ")); return; }
  var frag = document.createDocumentFragment();
  f.slice(0, 300).forEach(function (r) { frag.appendChild(item(r, function (x) { openOv(key(x)); })); });
  d.appendChild(frag);
}
["fQ", "fT", "fH"].forEach(function (id) { $(id).addEventListener("input", renderList); });

/* ═══════════════ MEHMON KARTASI (davomat + ro'yxat uchun bitta) ═══════════════ */
function drawGuest(host, r, where) {
  host.textContent = ""; host.classList.remove("hide");
  var card = el("div", "gcard " + r.t + (where === "dav" ? " anim" : ""));

  var h = el("div", "phdr");
  h.appendChild(el("div", "pav", initials(r.name)));
  h.appendChild(el("div", "pnm", r.name));
  h.appendChild(el("div", "pidd", TPL[r.t].label + " · ID " + r.id));
  var tags = el("div", "ptags");
  tags.appendChild(el("span", "ptag", r.att === "Келди" ? "✓ Келди " + (r.attAt || "") : r.att === "Келмади" ? "✕ Келмади" : "⏳ Кутилмоқда"));
  if (r.by) tags.appendChild(el("span", "ptag", "Киритди: " + r.by));
  h.appendChild(tags); card.appendChild(h);

  if (r.t === "b") {
    var st = el("div", "psts");
    [["Договор", fmt(r.dog), ""], ["Заклад", fmt(r.zak), ""], ["Тўлаган", fmt(r.paid), " cgr"],
     ["Қолган", fmt(r.qarz > 0 ? r.qarz : 0), r.qarz > 0 ? " crd" : " cgr"]].forEach(function (x) {
      var c = el("div", "pst"); c.appendChild(el("div", "pstn" + x[2], x[1])); c.appendChild(el("div", "pstl", x[0])); st.appendChild(c);
    });
    card.appendChild(st);
  }

  var b = el("div", "gbody");
  if (isDebt(r)) {
    b.appendChild(el("div", "qarzbox", "ҚАРЗ: " + fmt(r.qarz)));
    var pay = el("form", "payrow");
    var inp = el("input", "fi mny"); inp.type = "text"; inp.inputMode = "numeric"; inp.autocomplete = "off";
    inp.value = fmt(r.qarz); inp.setAttribute("aria-label", "Тўлов суммаси");
    var pb = el("button", "btn bp bsm", "Тўловни ёзиш");
    pay.appendChild(inp); pay.appendChild(pb);
    pay.addEventListener("submit", function (e) {
      e.preventDefault();
      var a = n0(inp.value);
      if (!(a > 0)) { toast("Суммани киритинг", true); return; }
      inp.blur();
      write("pay", r, { amount: a }, function (x) { x.paid = n0(x.paid) + a; x.qarz = n0(x.dog) - n0(x.zak) - n0(x.paid); });
      toast("Тўлов ёзилди: " + fmt(a));
    });
    b.appendChild(pay);
  } else if (r.t === "b") {
    b.appendChild(el("div", "okbox", "Қарзи йўқ"));
  } else {
    b.appendChild(el("div", "okbox", "Бепул таклифнома"));
  }

  function att(status, msg) {
    write("attend", r, { status: status }, function (x) {
      x.att = status; x.attAt = status === "Келди" ? hhmm() : ""; x.attBy = status ? me.name : "";
    });
    if (msg) toast(msg);
    if (where === "dav" && status === "Келди") { $("sId").value = ""; $("sId").focus(); }
  }

  if (r.att === "Келди") {
    var ok = el("div", "okbox", "✓ КЕЛДИ — " + (r.attAt || "")); ok.style.marginTop = "10px";
    ok.appendChild(el("small", "", "Белгилади: " + (r.attBy || "—")));
    b.appendChild(ok);
    var un = el("button", "btn bgr", "↩️ Бекор қилиш"); un.type = "button"; un.style.marginTop = "10px";
    un.addEventListener("click", function () { att("", "Бекор қилинди"); });
    b.appendChild(un);
  } else {
    var row = el("div", "brow"); row.style.marginTop = "12px";
    var k1 = el("button", "btn bg", "✅ КЕЛДИ"); k1.type = "button";
    k1.addEventListener("click", function () { att("Келди", r.name + " — келди"); });
    row.appendChild(k1);
    if (r.att === "Келмади") {
      var cl = el("button", "btn bgr", "Белгини олиш"); cl.type = "button";
      cl.addEventListener("click", function () { att("", ""); });
      row.appendChild(cl);
    } else {
      var k2 = el("button", "btn br", "❌ Келмади"); k2.type = "button";
      k2.addEventListener("click", function () { att("Келмади", ""); });
      row.appendChild(k2);
    }
    b.appendChild(row);
  }

  var r2 = el("div", "brow");
  var ed = el("button", "btn bgr", "✏️ Таҳрирлаш / расм"); ed.type = "button";
  ed.addEventListener("click", function () { closeOv(); go(r.t === "b" ? 3 : 4); openEdit(byKey(key(r)) || r); });
  r2.appendChild(ed);
  if (where === "ov") {
    var x = el("button", "btn bgr", "Ёпиш"); x.type = "button"; x.addEventListener("click", closeOv); r2.appendChild(x);
  }
  b.appendChild(r2);
  card.appendChild(b); host.appendChild(card);
}

function openOv(k) { var r = byKey(k); if (!r) return; ovKey = k; drawGuest($("ovBody"), r, "ov"); $("ov").classList.remove("hide"); }
function closeOv() { ovKey = null; $("ov").classList.add("hide"); }
$("ov").addEventListener("click", function (e) { if (e.target === $("ov")) closeOv(); });

/* ═══════════════ DAVOMAT ═══════════════ */
function showGuest(k) {
  $("sPick").textContent = ""; box("sMsg");
  curKey = k; drawGuest($("stCard"), byKey(k), "dav");
}
function lookup(v) {
  if (/^\d+$/.test(v)) { var id = String(parseInt(v, 10)); return rows.filter(function (r) { return r.id === id; }); }
  var q = v.toLowerCase();
  return rows.filter(function (r) { return r.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 15);
}
function search(retry) {
  var v = $("sId").value.trim(), pick = $("sPick");
  pick.textContent = ""; box("sMsg");
  if (!v) return;
  var f = lookup(v);
  if (f.length === 1) { showGuest(key(f[0])); return; }
  if (f.length > 1) {
    curKey = null; $("stCard").classList.add("hide");
    f.forEach(function (r) { pick.appendChild(item(r, function (x) { showGuest(key(x)); })); });
    return;
  }
  // topilmadi — balki boshqa xodim hozirgina qo'shgan: serverdan yangilab, bir marta qayta qidiramiz
  if (!retry) {
    box("sMsg", "minf", "Қидирилмоқда…");
    refresh(true, false).then(function () { search(true); });
    return;
  }
  curKey = null; $("stCard").classList.add("hide");
  box("sMsg", "mer", "Топилмади: " + v);
}
$("sForm").addEventListener("submit", function (e) { e.preventDefault(); search(false); });

function renderLast() {
  var d = $("lastD"); d.textContent = "";
  var came = rows.filter(function (r) { return r.att === "Келди"; });
  $("lastCnt").textContent = came.length + " / " + rows.length;
  came.sort(function (a, b) { return a.attAt < b.attAt ? 1 : a.attAt > b.attAt ? -1 : 0; });
  if (!came.length) { d.appendChild(el("div", "kri", "Ҳали ҳеч ким келмади")); return; }
  came.slice(0, 8).forEach(function (r) {
    var row = el("div", "krow"), l = el("div"); l.style.cursor = "pointer"; l.style.minWidth = "0";
    l.appendChild(el("div", "krn", r.name));
    l.appendChild(el("div", "kri", TPL[r.t].label + " · ID " + r.id + (r.attBy ? " · " + r.attBy : "")));
    l.addEventListener("click", function () { showGuest(key(r)); window.scrollTo(0, 0); });
    row.appendChild(l); row.appendChild(el("span", "bdg bkk", r.attAt || "✓"));
    d.appendChild(row);
  });
}

function resetForm(t) {
  edit[t] = null;
  $("form_" + t).reset();
  $("ft_" + t).textContent = t === "b" ? "🎫 Янги билет" : "💌 Янги таклифнома (бепул)";
  $("fs_" + t).textContent = t === "b" ? "Сақлаш ва билет чиқариш" : "Сақлаш ва таклифнома чиқариш";
  $("fx_" + t).classList.add("hide");
  $("pv_" + t).classList.add("hide");
}
function mv(v) { return v === "" || v == null ? "" : fmt(v); }
function openEdit(r) {
  var t = r.t;
  edit[t] = r.id;
  $("fn_" + t).value = r.name;
  if (t === "b") { $("fd_b").value = mv(r.dog); $("fz_b").value = mv(r.zak); $("fp_b").value = mv(r.paid); }
  $("ft_" + t).textContent = "✏️ " + TPL[t].label + " · ID " + r.id;
  $("fs_" + t).textContent = "Сақлаш";
  $("fx_" + t).classList.remove("hide");
  makeTicket(r);
}

["b", "t"].forEach(function (t) {
  $("form_" + t).addEventListener("submit", function (e) {
    e.preventDefault();
    var data = { t: t, name: $("fn_" + t).value.replace(/\s+/g, " ").trim() };
    if (!data.name) return;
    if (t === "b") { data.dog = $("fd_b").value; data.zak = $("fz_b").value; data.paid = $("fp_b").value; }
    if (edit[t]) data.id = edit[t];
    var btn = $("fs_" + t), old = btn.textContent;
    btn.disabled = true; btn.textContent = "Сақланмоқда…";
    api(edit[t] ? "update" : "add", data).then(function (j) {
      merge(j.row); saveCache();
      toast("Сақланди — ID " + j.row.id);
      openEdit(j.row);
    }).catch(function (err) {
      btn.textContent = old;
      if (!authFail(err)) toast(err.message, true);
    }).then(function () { btn.disabled = false; });
  });
  $("fx_" + t).addEventListener("click", function () { resetForm(t); $("fn_" + t).focus(); });

  $("pd_" + t).addEventListener("click", function () {
    if (!blob[t]) return;
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob[t]); a.download = fname[t];
    document.body.appendChild(a); a.click(); a.remove();
  });
  $("ps_" + t).addEventListener("click", function () {
    if (!blob[t]) return;
    var f = new File([blob[t]], fname[t], { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f] }).catch(function () {});
    else $("pd_" + t).click();
  });
});

/* ═══════════════ RASM CHIZISH ═══════════════ */
function makeTicket(r) {
  var t = r.t, P = TPL[t], img = P.img;
  var draw = function () {
    var c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    var k = c.width / P.w, g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    var FONT = "px Georgia, 'Times New Roman', serif";
    g.fillStyle = "#ffffff"; g.textAlign = "left"; g.textBaseline = "middle";

    // тик ёзув: (x, y) нуқтадан тепага қараб
    function up(lines, p, size) {
      g.save(); g.translate(p.x * k, p.y * k); g.rotate(-Math.PI / 2);
      g.font = "700 " + (size * k) + FONT;
      var gap = size * 1.12 * k, y0 = -(lines.length - 1) * gap / 2;
      lines.forEach(function (s, i) { g.fillText(s, 0, y0 + i * gap + size * 0.06 * k); });
      g.restore();
    }
    function width(s, size) { g.font = "700 " + (size * k) + FONT; return g.measureText(s).width / k; }
    function fit(lines, p, max, min) {
      var s = max;
      while (s > min && Math.max.apply(null, lines.map(function (x) { return width(x, s); })) > p.len) s -= 1;
      return s;
    }

    // — исм фамилия: сиғса бир қатор, сиғмаса икки қатор —
    var n = POS.name, words = r.name.split(" "), lines = [r.name], size = fit(lines, n, n.size, 12);
    if (size < 30 && words.length > 1) {
      var best = null;
      for (var i = 1; i < words.length; i++) {
        var two = [words.slice(0, i).join(" "), words.slice(i).join(" ")];
        var s2 = fit(two, n, Math.floor(n.boxW / 2.2), 10);
        if (!best || s2 > best.size) best = { lines: two, size: s2 };
      }
      if (best.size * 1.25 > size) { lines = best.lines; size = best.size; }
    }
    up(lines, n, size);

    // — ID —
    var d = POS.id, idText = String(r.id);
    up([idText], d, fit([idText], d, d.size, 14));

    c.toBlob(function (b) {
      blob[t] = b;
      fname[t] = P.file + "-" + r.id + "-" + r.name.replace(/[^\p{L}\p{N}]+/gu, "_") + ".jpg";
      var im = $("pm_" + t);
      if (im.src.indexOf("blob:") === 0) URL.revokeObjectURL(im.src);
      im.src = URL.createObjectURL(b);
      $("pi_" + t).textContent = "ID " + r.id;
      $("pv_" + t).classList.remove("hide");
      $("ps_" + t).classList.toggle("hide", !(navigator.canShare && window.File));
    }, "image/jpeg", 0.93);
  };
  if (img.complete && img.naturalWidth) draw();
  else { img.onload = draw; img.onerror = function () { toast("Расм юкланмади: " + P.src, true); }; }
}
